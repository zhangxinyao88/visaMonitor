name: visaMonitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "monitor = alert only if a date qualifies; status = push earliest slot per location"
        type: choice
        default: monitor
        options: [monitor, status, emergency-status]

concurrency:
  group: visamonitor
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright/python:v1.61.0-noble
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Install Playwright Python package
        run: |
          python -m pip --version >/dev/null 2>&1 || python -m ensurepip --upgrade
          python -m pip install --no-cache-dir --break-system-packages -r requirements.txt \
            || python -m pip install --no-cache-dir -r requirements.txt
          python -c "import playwright; print('playwright import OK')"

      - name: Restore monitor state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: visamonitor-state-${{ github.run_id }}
          restore-keys: |
            visamonitor-state-

      - name: Check availability
        env:
          PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
          VISA_NTFY_TOPIC: ${{ secrets.VISA_NTFY_TOPIC }}
          VISA_CITIES: ${{ vars.VISA_CITIES }}
          VISA_TYPE: ${{ vars.VISA_TYPE }}
          VISA_DESC: ${{ vars.VISA_DESC }}
          VISA_DESC_BY_CITY: ${{ vars.VISA_DESC_BY_CITY }}
          VISA_START: ${{ vars.VISA_START }}
          VISA_CUTOFF: ${{ vars.VISA_CUTOFF }}
          VISA_INCLUDE_EMERGENCY: ${{ vars.VISA_INCLUDE_EMERGENCY }}
          VISA_EMERGENCY_TYPES: ${{ vars.VISA_EMERGENCY_TYPES }}
          VISA_PUSH_REPEAT: ${{ vars.VISA_PUSH_REPEAT }}
          VISA_PUSH_INTERVAL: ${{ vars.VISA_PUSH_INTERVAL }}
          PYTHONUTF8: "1"
        run: |
          case "${{ inputs.mode }}" in
            status)           python monitor.py --check ;;
            emergency-status) python monitor.py --check --emergency ;;
            *)                python window_monitor.py --once ;;
          esac

      - name: Save monitor state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: visamonitor-state-${{ github.run_id }}
